version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    ignore:
      # astro check does not support TypeScript 7 and will be deprecated. Its replacement,
      # @astrojs/ts-content-mapper, needs TypeScript 7.1+, so only 7.0 is skipped.
      - dependency-name: typescript
        versions: ['7.0.x']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-site
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
