version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    ignore:
      # astro check (@astrojs/check) only supports TypeScript 5 and 6; remove once it supports 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-site
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
