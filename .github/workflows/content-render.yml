name: Content Render (Quarto -> Markdown)

on:
  push:
    branches: [main, master]
    paths:
      - 'src/content/**/*.qmd'
      - 'src/content/**/*.md'
      - 'scripts/build-blog-cli.ts'
      - 'scripts/blog-build/**/*.ts'
      - 'scripts/markdown-transforms.ts'
      - '_quarto.yml'
      - '.github/workflows/content-render.yml'
      - 'astro.config.mjs'
      - 'package.json'
      - 'src/**/*.astro'
      - 'src/**/*.ts'
      - 'src/**/*.js'
      - 'src/styles/**/*.css'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: 'render-${{ github.ref }}'
  cancel-in-progress: true

env:
  ARTIFACT_RETENTION_DAYS: 90

jobs:
  render:
    name: Render Quarto content
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        id: setup-r
        uses: r-lib/actions/setup-r@v2

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: always
          packages: 'any::sessioninfo'
          extra-packages: |
            any::knitr
            any::rmarkdown
            any::tidyverse
            any::brms
            any::furrr
            any::patchwork
            any::extraDistr
            any::loo
            any::ggdag
            any::GGally
            any::dagitty
            any::plotly
            any::DT
            any::htmlwidgets
            any::tidybayes
            any::here
            any::readr
            any::lubridate
            any::ragg
            github::sims1253/bayesim

      - name: Cache render state
        uses: actions/cache@v4
        with:
          path: |
            .cache/blog-build
            .blog-cache
            _freeze
            src/content/blog/**/*_cache
          key: render-cache-${{ runner.os }}-r${{ steps.setup-r.outputs.installed-r-version }}-${{ hashFiles('src/content/**/*.qmd', 'scripts/build-blog-cli.ts', 'scripts/blog-build/**/*.ts', 'scripts/markdown-transforms.ts', '_quarto.yml') }}
          restore-keys: |
            render-cache-${{ runner.os }}-r${{ steps.setup-r.outputs.installed-r-version }}-
            render-cache-${{ runner.os }}-

      - name: Determine build flags
        id: build-flags
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          flags=""
          if [ "${{ github.event_name }}" = "push" ]; then
            if printf '%s\n' "$HEAD_COMMIT_MESSAGE" | grep -Fq '[force-rebuild]'; then
              flags="--force"
            fi
          fi
          echo "flags=$flags" >> "$GITHUB_OUTPUT"

      - name: Get latest content render run
        id: latest-render
        if: steps.build-flags.outputs.flags != '--force'
        run: |
          latest_run=$(gh run list \
            --workflow="Content Render (Quarto -> Markdown)" \
            --status=success \
            --limit=5 \
            --json=databaseId \
            --jq="map(select(.databaseId != ${{ github.run_id }})) | .[0].databaseId // empty" || echo "")
          echo "run-id=$latest_run" >> $GITHUB_OUTPUT
          if [ -n "$latest_run" ]; then
            echo "Found previous run: $latest_run"
          else
            echo "No previous run found"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download previous rendered content
        id: download-previous
        if: steps.build-flags.outputs.flags != '--force' && steps.latest-render.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: rendered-content
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.latest-render.outputs.run-id }}
        continue-on-error: true

      - name: Log previous content status
        run: |
          if [ "${{ steps.download-previous.outcome }}" = "success" ]; then
            echo "Downloaded previous rendered content"
          else
            echo "No previous artifact downloaded"
          fi
          count=$(find src/content/blog -name "index.md" -type f | wc -l || echo 0)
          echo "Available markdown files before render: $count"

      - name: Show build plan
        run: |
          bun run scripts/build-blog-cli.ts --plan ${{ steps.build-flags.outputs.flags }}

      - name: Render Quarto posts
        run: |
          bun run scripts/build-blog-cli.ts ${{ steps.build-flags.outputs.flags }}

      - name: Verify rendered output
        run: |
          echo "::group::Generated Files"
          find src/content/blog -name "index.md" -type f | head -20
          count=$(find src/content/blog -name "index.md" -type f | wc -l)
          echo "Total: $count index.md files"
          echo "::endgroup::"

          if [ "$count" -eq 0 ]; then
            echo "::error::No markdown files were generated"
            exit 1
          fi

      - name: Upload rendered content artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-content
          if-no-files-found: error
          compression-level: 6
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          path: |
            src/content/blog/*/*/
            .cache/blog-build/
            .blog-cache/
            _freeze/
            src/content/blog/**/*_cache/
