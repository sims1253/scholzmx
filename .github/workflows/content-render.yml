name: Content Render (Quarto → Markdown)

on:
  workflow_call:
    inputs:
      force-render:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  render:
    name: Render Quarto content
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fingerprint render inputs
        id: inputs
        run: echo "key=$(python3 scripts/render-content.py key)" >> "$GITHUB_OUTPUT"

      - name: Restore generated content for these exact inputs
        id: cache
        if: ${{ !inputs.force-render }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .rendered-content
          key: rendered-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.key }}

      - name: Setup Quarto
        if: steps.cache.outputs.cache-hit != 'true'
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: '1.10.18'

      - name: Setup R
        if: steps.cache.outputs.cache-hit != 'true'
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.6.1'
          use-public-rspm: false
          cran: https://packagemanager.posit.co/cran/__linux__/noble/2026-09-01

      - name: Setup R dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          cache: always
          install-quarto: false
          install-pandoc: false
          dependencies: 'NA'
          cache-version: '2026-09-01'
          packages: 'any::sessioninfo'
          # Binary RStan installs omit LinkingTo packages needed to compile models at runtime.
          extra-packages: |
            any::knitr
            any::rmarkdown
            any::tidyverse
            any::brms
            any::BH
            any::Rcpp
            any::RcppEigen
            any::RcppParallel
            any::StanHeaders
            any::furrr
            any::patchwork
            any::extraDistr
            any::loo
            any::ggdag
            any::GGally
            any::dagitty
            any::ragg

      - name: Verify Stan compilation headers
        if: steps.cache.outputs.cache-hit != 'true'
        shell: Rscript {0}
        run: |
          packages <- c("BH", "Rcpp", "RcppEigen", "RcppParallel", "StanHeaders")
          headers <- vapply(packages, function(package) system.file("include", package = package), character(1))
          missing <- packages[!nzchar(headers)]
          if (length(missing)) stop("Missing Stan headers: ", paste(missing, collapse = ", "))

      - name: Render and export generated files
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          bash build-blog.sh --force
          git diff --exit-code -- src/content src/assets
          python3 scripts/render-content.py export

      - name: Validate cached content
        if: steps.cache.outputs.cache-hit == 'true'
        run: python3 scripts/render-content.py restore

      - name: Save generated content
        if: steps.cache.outputs.cache-hit != 'true' && !inputs.force-render
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .rendered-content
          key: rendered-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.key }}

      - name: Upload generated content for this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-content
          path: .rendered-content/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
