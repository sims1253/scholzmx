name: PR preview

# Publishes the site CI has just built and tested for a pull request as a Cloudflare
# Worker Preview (wrangler.jsonc), then runs the production Lighthouse budgets against
# it. Production stays on GitHub Pages. Setup (once): see "PR previews" in README.md.

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions: {}

jobs:
  preview:
    name: Preview on Cloudflare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    # Shared with preview-cleanup.yml and never cancelled, so a deploy and the cleanup
    # run one after the other; a deploy queued behind the cleanup sees the PR closed.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
      WRANGLER_VERSION: 4.152.0
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check for Cloudflare credentials and an open PR
        id: credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::notice title=No preview::Cloudflare secrets are not available to this run (a fork, Dependabot without Dependabot secrets, or not set up yet)."
          # A run that reaches this point after the PR closed must not bring back the
          # preview preview-cleanup.yml deleted.
          elif [ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" != OPEN ]; then
            echo "::notice title=No preview::The pull request is no longer open."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credentials.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-site
        if: steps.credentials.outputs.ready == 'true'
      - name: Download the tested site
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      - name: Deploy the preview
        id: deploy
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Keep previews out of search results. Only this uploaded copy gets the file;
          # GitHub Pages would serve it as a plain file.
          printf '/*\n  X-Robots-Tag: noindex\n' > dist/_headers
          # wrangler logs progress to stdout and writes its result (one JSON object per
          # line, `preview_urls` among them) only to WRANGLER_OUTPUT_FILE_PATH.
          export WRANGLER_OUTPUT_FILE_PATH=/tmp/wrangler-output.json
          npx --yes "wrangler@$WRANGLER_VERSION" preview --name "$PREVIEW_NAME"
          url=$(jq -er 'select(.type == "preview") | .preview_urls[0]' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Setup Chrome
        if: steps.deploy.outcome == 'success'
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: stable

      # Lab numbers from a shared runner against a different CDN are noisy, so budget
      # misses are reported on the PR rather than failing it. Production keeps its gate
      # in performance.yml.
      - name: Lighthouse budgets on the preview
        id: lighthouse
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -o pipefail
          # Previews are noindex (see above), so the crawlability audit can't pass there;
          # everything else is the production config.
          mapfile -t urls < <(jq -r --arg base "${PREVIEW_URL%/}" '.urls[] | sub("^https://[^/]+"; $base) | "--url=" + .' .pa11yci.json)
          bunx --no-install lhci autorun --config=.lighthouserc.cjs \
            --assert.assertions.is-crawlable=off \
            --assert.assertions.categories:seo=off \
            "${urls[@]}" 2>&1 | tee /tmp/lighthouse.txt

      - name: Write the PR comment
        if: steps.deploy.outcome == 'success'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          LIGHTHOUSE: ${{ steps.lighthouse.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "**Preview:** ${PREVIEW_URL} (at \`${HEAD_SHA:0:7}\`)"
            echo
            if [ "$LIGHTHOUSE" = success ]; then
              echo "Lighthouse budgets pass on the preview."
            else
              echo "Lighthouse budgets missed on the preview; see the [run](${RUN_URL}) for details."
            fi
            grep -o 'https://storage.googleapis.com/[^ ]*' /tmp/lighthouse.txt 2>/dev/null \
              | sed 's/^/- Report: /' || true
          } > /tmp/preview-comment.md
          cat /tmp/preview-comment.md >> "$GITHUB_STEP_SUMMARY"
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.deploy.outcome == 'success'
        with:
          header: preview
          path: /tmp/preview-comment.md
