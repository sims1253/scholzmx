name: PR preview cleanup

# Deletes a pull request's Cloudflare Worker Preview (preview.yml) once it is closed.

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  delete:
    name: Delete the preview
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Fork PRs never got a preview, and their runs cannot read the secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    # Shared with preview.yml: cancels a deploy still running for this PR.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
      WRANGLER_VERSION: 4.152.0
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check for Cloudflare credentials
        id: credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credentials.outputs.ready == 'true'
        with:
          persist-credentials: false
      - name: Delete the preview
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes "wrangler@$WRANGLER_VERSION" preview delete --name "$PREVIEW_NAME" \
            --skip-confirmation > /tmp/delete.log 2>&1; then
            cat /tmp/delete.log
          # A PR closed before its first preview has nothing to delete; any other
          # failure (credentials, Cloudflare) must show.
          elif grep -qiE 'not found|does not exist|no preview' /tmp/delete.log; then
            cat /tmp/delete.log
            echo "::notice::No preview named $PREVIEW_NAME to delete."
          else
            cat /tmp/delete.log
            exit 1
          fi
