name: Code Quality CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      force-render:
        description: Render every Quarto post without reusing the content cache
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  automation:
    name: Workflow and render tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Fail here instead of uploading code-scanning alerts; config in .github/zizmor.yml.
          advanced-security: false
          min-severity: medium
      - name: Test render failures and artifact isolation
        run: python3 -m unittest discover -s scripts/tests -v

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-site
      - run: bun run quality:check

  render:
    uses: ./.github/workflows/content-render.yml
    with:
      force-render: ${{ inputs.force-render || false }}

  site:
    name: Accessibility Testing
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-site
      - name: Download this run's generated content
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered-content
          path: .rendered-content
      - name: Restore generated files and verify every Quarto post
        run: python3 scripts/render-content.py restore
      - name: Check the complete content collection
        run: bun run typecheck
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: stable
      - name: Build once and test the complete site
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: bun run test:site
      - name: Check internal links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Links between the site's own pages only; links-weekly.yml checks external ones.
          args: --offline --root-dir ${{ github.workspace }}/dist --include-fragments --no-progress dist
      - name: Keep the tested site for the preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 3
      - name: Upload the tested site
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 7

  ci-passed:
    name: CI passed
    if: always()
    needs: [automation, code-quality, render, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

  # Not part of ci-passed: fork PRs have no secrets, and a preview is a convenience.
  preview:
    needs: site
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/preview.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    needs: ci-passed
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
