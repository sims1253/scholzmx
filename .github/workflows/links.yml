name: Weekly link check

# Checks every link on the published pages, including external ones, which change
# without a commit here. Instead of failing every week, it keeps one issue up to date
# with what is broken and closes it once everything resolves again. Links between the
# site's own pages are checked on every PR in ci.yml.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, before Dependabot
  workflow_dispatch:

permissions: {}

concurrency:
  group: links
  cancel-in-progress: true

jobs:
  links:
    name: Check published links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      issues: write
    env:
      SITE: https://www.scholzmx.com
      ISSUE_TITLE: Broken links on the published site
    steps:
      - name: List the published pages
        run: |
          curl -fsSL "$SITE/sitemap-0.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' > pages.txt
          test -s pages.txt

      - name: Check every link on them
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # 403 and 429 are bot walls and rate limits, not dead links.
          args: >-
            --files-from pages.txt --no-progress --max-retries 3 --max-redirects 10
            --max-concurrency 8 --accept '200..=299,403,429'
          output: lychee/report.md
          fail: false

      - name: Report on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BROKEN: ${{ steps.lychee.outputs.exit_code != '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == env.ISSUE_TITLE))[0].number // empty")
          if [ "$BROKEN" = true ]; then
            { cat lychee/report.md; echo; echo "From the [weekly link check]($RUN_URL)."; } > body.md
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file body.md
            else
              gh issue create --title "$ISSUE_TITLE" --body-file body.md
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Every link resolves again ([run]($RUN_URL))."
          fi
