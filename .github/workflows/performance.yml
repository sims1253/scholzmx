name: Performance Monitoring

on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: 'performance-${{ github.ref }}'
  cancel-in-progress: true

env:
  # Define audited pages centrally - easier to maintain
  AUDIT_PATHS: '/ /blog/ /research/ /projects/ /notes/ /blog/2025/01-15-blog-post-features-template/ /recipes/hokkaido-dinner-rolls/'

permissions:
  contents: read
  actions: read

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      base-url: ${{ steps.site.outputs.base-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve deployed site URL
        id: site
        run: |
          if [ -f public/CNAME ]; then
            domain=$(cat public/CNAME | tr -d '\n' | tr -d '\r')
            base_url="https://$domain"
          else
            owner="${{ github.repository_owner }}"
            repo="${{ github.event.repository.name }}"
            base_url="https://$owner.github.io/$repo"
          fi
          echo "base-url=$base_url" >> $GITHUB_OUTPUT
          echo "Site URL: $base_url"

      - name: Run Lighthouse CI Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.site.outputs.base-url }}/
            ${{ steps.site.outputs.base-url }}/blog/
            ${{ steps.site.outputs.base-url }}/research/
            ${{ steps.site.outputs.base-url }}/projects/
            ${{ steps.site.outputs.base-url }}/notes/
            ${{ steps.site.outputs.base-url }}/blog/2025/01-15-blog-post-features-template/
            ${{ steps.site.outputs.base-url }}/recipes/hokkaido-dinner-rolls/
          configPath: .lighthouserc.cjs
          budgetPath: .lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Performance Summary
        if: always()
        run: |
          echo "## Lighthouse Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Site:** ${{ steps.site.outputs.base-url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f .lighthouseci/manifest.json ]; then
            echo "| Page | Perf | A11y | Best Practices | SEO |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|------|----------------|-----|" >> $GITHUB_STEP_SUMMARY

            jq -r '.[] | "\(.url)|\(.summary.performance)|\(.summary.accessibility)|\(.summary["best-practices"])|\(.summary.seo)"' .lighthouseci/manifest.json | while IFS='|' read -r url perf a11y bp seo; do
              path=$(echo "$url" | sed "s|${{ steps.site.outputs.base-url }}||")
              [ -z "$path" ] && path="/"
              perf_pct=$(awk "BEGIN {printf \"%.0f\", $perf * 100}")
              a11y_pct=$(awk "BEGIN {printf \"%.0f\", $a11y * 100}")
              bp_pct=$(awk "BEGIN {printf \"%.0f\", $bp * 100}")
              seo_pct=$(awk "BEGIN {printf \"%.0f\", $seo * 100}")
              echo "| \`$path\` | $perf_pct | $a11y_pct | $bp_pct | $seo_pct |" >> $GITHUB_STEP_SUMMARY
            done

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Targets: Performance >= 90, others >= 80" >> $GITHUB_STEP_SUMMARY
          else
            echo "No Lighthouse results available" >> $GITHUB_STEP_SUMMARY
          fi

  accessibility:
    name: Deep Accessibility Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lighthouse
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get latest content render run
        id: render-run
        run: |
          latest_run=$(gh run list \
            --workflow="Content Render (Quarto → Markdown)" \
            --status=success \
            --limit=1 \
            --json=databaseId \
            --jq='.[0].databaseId // empty' || echo "")
          echo "run-id=$latest_run" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download rendered content
        if: steps.render-run.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: rendered-content
          path: rendered
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.render-run.outputs.run-id }}
        continue-on-error: true

      - name: Merge rendered content
        if: steps.render-run.outputs.run-id != ''
        run: |
          if [ -d rendered/src/content/blog ]; then
            rsync -av rendered/src/content/blog/ src/content/blog/
          fi
          if [ -d rendered/src/assets/images/blog ]; then
            rsync -av rendered/src/assets/images/blog/ src/assets/images/blog/
          fi

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Build site
        run: bun run build

      - name: Test accessibility with Pa11y CI
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          echo "Testing pages with Pa11y CI..."
          echo "Using Chrome at: $PUPPETEER_EXECUTABLE_PATH"
          set +e
          bun run preview > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          # Wait for the preview server to come up
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4321/ > /dev/null 2>&1; then break; fi
            sleep 1
          done
          bunx pa11y-ci --config .pa11yci.json \
            http://localhost:4321/ \
            http://localhost:4321/blog/ \
            http://localhost:4321/research/ \
            http://localhost:4321/projects/ \
            http://localhost:4321/notes/ \
            http://localhost:4321/recipes/hokkaido-dinner-rolls/ \
            http://localhost:4321/blog/2025/01-15-blog-post-features-template/ 2>&1 | tee /tmp/pa11y-output.txt
          exit_code=$?
          kill $PREVIEW_PID 2>/dev/null
          set -e

          # Parse the summary line (e.g., "✘ 4/5 URLs passed" or "✔ 5/5 URLs passed")
          if grep -q "URLs passed" /tmp/pa11y-output.txt; then
            summary=$(grep "URLs passed" /tmp/pa11y-output.txt | tail -1)
            passed=$(echo "$summary" | grep -oP '\d+(?=/\d+ URLs)')
            total=$(echo "$summary" | grep -oP '\d+(?= URLs)')
            failed=$((total - passed))
          else
            passed=0
            failed=0
          fi

          echo "PASSED=$passed" >> $GITHUB_ENV
          echo "FAILED=$failed" >> $GITHUB_ENV

          if [ "$exit_code" -ne 0 ]; then
            echo "::warning::$failed page(s) have accessibility issues"
          fi

      - name: Accessibility Summary
        if: always()
        run: |
          echo "## Accessibility Audit (Pa11y CI)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/pa11y-output.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No results available"
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Standard: WCAG 2.1 AA" >> $GITHUB_STEP_SUMMARY
