name: Performance Monitoring

on:
  workflow_run:
    workflows: ['Code Quality CI']
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit deployed site
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-site
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: stable
      - name: Resolve audit URLs
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlsplit
          owner, repo = os.environ['REPOSITORY'].split('/')
          cname = Path('public/CNAME')
          if cname.exists():
              base = 'https://' + cname.read_text().strip()
          else:
              base = f'https://{owner}.github.io'
              if repo.lower() != f'{owner}.github.io'.lower():
                  base += '/' + repo
          config = json.loads(Path('.pa11yci.json').read_text())
          config['urls'] = [base + urlsplit(url).path for url in config['urls']]
          Path('/tmp/pa11yci.json').write_text(json.dumps(config))
          PY
      - name: Lighthouse budgets
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          mapfile -t urls < <(jq -r '.urls[] | "--url=" + .' /tmp/pa11yci.json)
          bunx --no-install lhci autorun --config=.lighthouserc.cjs "${urls[@]}"
      - name: Accessibility audit
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: bunx --no-install pa11y-ci --config /tmp/pa11yci.json 2>&1 | tee /tmp/pa11y-output.txt
      - name: Save audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-audits
          path: |
            .lighthouseci/
            /tmp/pa11y-output.txt
          include-hidden-files: true
          retention-days: 14
      - name: Audit summary
        if: always()
        run: |
          {
            echo '## Production audits'
            echo 'Lighthouse reports are attached in the production-audits artifact.'
            echo '### Pa11y (WCAG 2 AA)'
            echo '```'
            cat /tmp/pa11y-output.txt 2>/dev/null || echo 'No Pa11y results available.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
